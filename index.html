<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZT Network — Próximamente</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050a0f;
    --accent: #00c8ff;
    --accent2: #0066cc;
    --text: #e0f0ff;
    --muted: #4a7a9b;
    --grid: rgba(0, 120, 200, 0.08);
  }

  * { cursor: none !important; }

  #cursor {
    position: fixed;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--accent), 0 0 20px rgba(0,200,255,0.4);
  }

  #cursor-ring {
    position: fixed;
    width: 28px; height: 28px;
    border: 1px solid rgba(0,200,255,0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
  }

  .cursor-trail {
    position: fixed;
    border-radius: 50%;
    background: rgba(0,200,255,0.4);
    pointer-events: none;
    z-index: 9997;
    transform: translate(-50%, -50%);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
  }

  #canvas { position: fixed; inset: 0; z-index: 0; }
  #particle-canvas { position: fixed; inset: 0; z-index: 4; pointer-events: none; }

  .grid-overlay {
    position: fixed; inset: 0; z-index: 1;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .scanlines {
    position: fixed; inset: 0; z-index: 2;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
  }

  .vignette {
    position: fixed; inset: 0; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }

  .container {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem; text-align: center;
  }

  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: var(--accent);
    border: 1px solid rgba(0,200,255,0.3);
    padding: 0.35rem 1rem;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeSlideDown 0.8s ease 0.3s forwards;
    background: rgba(0,200,255,0.05);
    text-transform: uppercase;
    min-width: 280px;
    min-height: 26px;
  }

  #badge-text::after {
    content: '|';
    animation: blink 0.7s step-end infinite;
    color: var(--accent);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .logo-wrap {
    opacity: 0;
    animation: fadeSlideUp 1s ease 0.6s forwards;
    margin-bottom: 1.5rem;
    position: relative;
  }

  .logo-svg {
    width: 360px; height: auto;
    filter: drop-shadow(0 0 20px rgba(0,200,255,0.4));
    animation: logoPulse 3s ease-in-out 1.8s infinite;
    transition: filter 0.3s ease;
  }

  .logo-wrap:hover .logo-svg {
    filter: drop-shadow(0 0 35px rgba(0,200,255,0.9)) drop-shadow(0 0 60px rgba(0,100,200,0.5));
    animation: none;
  }

  @keyframes logoPulse {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(0,200,255,0.4)); }
    50%       { filter: drop-shadow(0 0 40px rgba(0,200,255,0.8)) drop-shadow(0 0 70px rgba(0,80,180,0.4)); }
  }

  .slogan {
    font-family: 'Exo 2', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeSlideUp 1s ease 0.9s forwards;
    margin-bottom: 4rem;
  }

  .slogan span { color: rgba(0,200,255,0.6); }

  .divider {
    width: 120px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 0 auto 4rem;
    opacity: 0;
    animation: fadeIn 1s ease 1.2s forwards;
  }

  .coming-soon-block {
    opacity: 0;
    animation: fadeSlideUp 1s ease 1.4s forwards;
  }

  .coming-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .coming-text {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: clamp(2.5rem, 6vw, 5rem);
    letter-spacing: 0.12em;
    line-height: 1;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 60%, #0044aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
    animation: glitchLoop 6s ease-in-out 3s infinite;
  }

  .coming-text::before,
  .coming-text::after {
    content: 'Próximamente';
    position: absolute;
    top: 0; left: 0; right: 0;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent) 60%, #0044aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
  }

  .coming-text::before {
    animation: glitchBefore 6s ease-in-out 3s infinite;
    clip-path: polygon(0 15%, 100% 15%, 100% 40%, 0 40%);
  }

  .coming-text::after {
    animation: glitchAfter 6s ease-in-out 3s infinite;
    clip-path: polygon(0 60%, 100% 60%, 100% 85%, 0 85%);
  }

  @keyframes glitchLoop {
    0%, 84%, 100% { transform: translate(0); }
    85%  { transform: translate(-3px, 1px); }
    86%  { transform: translate(3px, -1px); }
    87%  { transform: translate(0); }
    89%  { transform: translate(2px, 2px); }
    90%  { transform: translate(-2px, -1px); }
    91%  { transform: translate(0); }
  }

  @keyframes glitchBefore {
    0%, 84%, 100% { opacity: 0; transform: translate(0); }
    85%  { opacity: 0.8; transform: translate(4px, 0); filter: hue-rotate(90deg); }
    86%  { opacity: 0; }
    89%  { opacity: 0.6; transform: translate(-4px, 0); filter: hue-rotate(-90deg); }
    90%  { opacity: 0; }
  }

  @keyframes glitchAfter {
    0%, 84%, 100% { opacity: 0; transform: translate(0); }
    86%  { opacity: 0.7; transform: translate(-4px, 0); filter: hue-rotate(180deg); }
    87%  { opacity: 0; }
    90%  { opacity: 0.5; transform: translate(4px, 0); }
    91%  { opacity: 0; }
  }

  .progress-wrap {
    margin-top: 3rem;
    opacity: 0;
    animation: fadeIn 1s ease 1.8s forwards;
  }

  .progress-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    width: 280px;
  }

  .progress-bar {
    width: 280px; height: 2px;
    background: rgba(0,200,255,0.1);
    position: relative; overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    box-shadow: 0 0 8px var(--accent);
    width: 0%;
    position: relative;
    transition: width 0.05s linear;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 20px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9));
    animation: progressShine 2s ease-in-out 3.5s infinite;
    opacity: 0;
  }

  @keyframes progressShine {
    0%   { opacity: 0; }
    50%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .domain {
    margin-top: 3.5rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    opacity: 0;
    animation: fadeIn 1s ease 2.2s forwards;
  }

  .domain a { color: rgba(0,200,255,0.6); text-decoration: none; transition: color 0.3s; }
  .domain a:hover { color: var(--accent); }

  .corner {
    position: fixed;
    width: 40px; height: 40px;
    z-index: 5; opacity: 0;
    animation: fadeIn 1s ease 2.5s forwards;
  }

  .corner--tl { top: 20px; left: 20px; border-top: 1px solid rgba(0,200,255,0.4); border-left: 1px solid rgba(0,200,255,0.4); }
  .corner--tr { top: 20px; right: 20px; border-top: 1px solid rgba(0,200,255,0.4); border-right: 1px solid rgba(0,200,255,0.4); }
  .corner--bl { bottom: 20px; left: 20px; border-bottom: 1px solid rgba(0,200,255,0.4); border-left: 1px solid rgba(0,200,255,0.4); }
  .corner--br { bottom: 20px; right: 20px; border-bottom: 1px solid rgba(0,200,255,0.4); border-right: 1px solid rgba(0,200,255,0.4); }

  .status {
    position: fixed; bottom: 28px; right: 70px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.15em;
    color: var(--muted); z-index: 10;
    display: flex; align-items: center; gap: 0.5rem;
    opacity: 0; animation: fadeIn 1s ease 2.5s forwards;
  }

  @media (max-width: 600px) {
    .status { display: none; }
    .corner { width: 24px; height: 24px; }
  }

  .status-dot {
    width: 6px; height: 6px;
    background: var(--accent); border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--accent); }
    50%       { opacity: 0.4; box-shadow: none; }
  }

  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<canvas id="canvas"></canvas>
<canvas id="particle-canvas"></canvas>
<div class="grid-overlay"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div class="status">
  <div class="status-dot"></div>
  SISTEMA EN CONFIGURACIÓN
</div>

<div class="container">

  <div class="badge"><span id="badge-text"></span></div>

  <div class="logo-wrap" id="logo-wrap">
    <svg class="logo-svg" viewBox="0 0 420 110" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#00c8ff"/>
          <stop offset="100%" style="stop-color:#0055cc"/>
        </linearGradient>
        <linearGradient id="ztGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#00e5ff"/>
          <stop offset="100%" style="stop-color:#0099dd"/>
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#e0f0ff"/>
          <stop offset="100%" style="stop-color:#a0d0f0"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Shield ícono (solo nodos, sin texto ZT adentro) -->
      <g transform="translate(8, 8)" filter="url(#glow)">
        <path d="M34 4 L56 13 L56 38 C56 52 45 63 34 69 C23 63 12 52 12 38 L12 13 Z"
              fill="none" stroke="url(#accentGrad)" stroke-width="2"/>
        <circle cx="34" cy="36" r="3.5" fill="url(#accentGrad)"/>
        <line x1="34" y1="36" x2="24" y2="26" stroke="#00c8ff" stroke-width="1.2" opacity="0.8"/>
        <line x1="34" y1="36" x2="44" y2="26" stroke="#00c8ff" stroke-width="1.2" opacity="0.8"/>
        <line x1="34" y1="36" x2="22" y2="46" stroke="#00c8ff" stroke-width="1.2" opacity="0.8"/>
        <line x1="34" y1="36" x2="46" y2="46" stroke="#00c8ff" stroke-width="1.2" opacity="0.8"/>
        <circle cx="24" cy="26" r="2.5" fill="none" stroke="#00c8ff" stroke-width="1.2"/>
        <circle cx="44" cy="26" r="2.5" fill="none" stroke="#00c8ff" stroke-width="1.2"/>
        <circle cx="22" cy="46" r="2.5" fill="#0055cc"/>
        <circle cx="46" cy="46" r="2.5" fill="none" stroke="#00c8ff" stroke-width="1.2"/>
      </g>

      <!-- ZT mismo tamaño que NETWORK -->
      <text x="74" y="55" font-family="Rajdhani, sans-serif" font-weight="700" font-size="42" fill="url(#ztGrad)" letter-spacing="3" filter="url(#glow)">ZT</text>

      <!-- Separador vertical -->
      <line x1="148" y1="18" x2="148" y2="68" stroke="rgba(0,200,255,0.25)" stroke-width="1"/>

      <!-- NETWORK -->
      <text x="158" y="55" font-family="Rajdhani, sans-serif" font-weight="700" font-size="42" fill="url(#textGrad)" letter-spacing="3">NETWORK</text>

      <!-- Línea y subtítulo -->
      <line x1="74" y1="65" x2="415" y2="65" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5"/>
      <text x="74" y="81" font-family="Share Tech Mono, monospace" font-size="8" fill="#4a7a9b" letter-spacing="2">INFRAESTRUCTURA  ·  SEGURIDAD  ·  CONECTIVIDAD</text>
    </svg>
  </div>

  <div class="slogan">Tecnología que conecta. <span>Soluciones que protegen.</span></div>

  <div class="divider"></div>

  <div class="coming-soon-block">
    <div class="coming-label">// Estado del proyecto</div>
    <div class="coming-text">Próximamente</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>DESARROLLO EN PROGRESO</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="domain">
    <a href="#">ztnetwork.cl</a>
    <span style="margin: 0 0.6em; opacity:0.3;">·</span>
    <a href="mailto:contacto@ztnetwork.cl">contacto@ztnetwork.cl</a>
  </div>

</div>

<script>
// ── CURSOR ──────────────────────────────────────────────────────────────
const cursorEl   = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
const TRAIL_N    = 8;
const trails     = [];
const trailPos   = Array.from({ length: TRAIL_N }, () => ({ x: 0, y: 0 }));
let   mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;

for (let i = 0; i < TRAIL_N; i++) {
  const el = document.createElement('div');
  el.className = 'cursor-trail';
  const sz = Math.max(1, 4 - i * 0.35);
  el.style.cssText = `width:${sz}px;height:${sz}px;opacity:${(1 - i / TRAIL_N) * 0.5}`;
  document.body.appendChild(el);
  trails.push(el);
}

document.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  cursorEl.style.left = mouseX + 'px';
  cursorEl.style.top  = mouseY + 'px';
});

(function animCursor() {
  ringX += (mouseX - ringX) * 0.15;
  ringY += (mouseY - ringY) * 0.15;
  cursorRing.style.left = ringX + 'px';
  cursorRing.style.top  = ringY + 'px';
  for (let i = TRAIL_N - 1; i > 0; i--) {
    trailPos[i].x = trailPos[i-1].x;
    trailPos[i].y = trailPos[i-1].y;
  }
  trailPos[0].x = mouseX; trailPos[0].y = mouseY;
  trails.forEach((el, i) => {
    el.style.left = trailPos[i].x + 'px';
    el.style.top  = trailPos[i].y + 'px';
  });
  requestAnimationFrame(animCursor);
})();

// ── RED DE NODOS (fondo) ────────────────────────────────────────────────
const bgCanvas = document.getElementById('canvas');
const bgCtx    = bgCanvas.getContext('2d');
let nodes = [], W, H;

function resize() {
  W = bgCanvas.width  = window.innerWidth;
  H = bgCanvas.height = window.innerHeight;
}

function initNodes() {
  nodes = [];
  const n = Math.floor((W * H) / 18000);
  for (let i = 0; i < n; i++) {
    nodes.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.5 + 0.5, pulse: Math.random() * Math.PI * 2
    });
  }
}

(function drawNet() {
  bgCtx.clearRect(0, 0, W, H);
  const t = Date.now() * 0.001;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d < 150) {
        bgCtx.beginPath();
        bgCtx.strokeStyle = `rgba(0,150,220,${(1-d/150)*0.12})`;
        bgCtx.lineWidth = 0.5;
        bgCtx.moveTo(nodes[i].x, nodes[i].y);
        bgCtx.lineTo(nodes[j].x, nodes[j].y);
        bgCtx.stroke();
      }
    }
  }
  nodes.forEach(n => {
    const g = (Math.sin(t + n.pulse) + 1) * 0.5;
    bgCtx.beginPath();
    bgCtx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(0,200,255,${0.2 + g * 0.4})`;
    bgCtx.fill();
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > W) n.vx *= -1;
    if (n.y < 0 || n.y > H) n.vy *= -1;
  });
  requestAnimationFrame(drawNet);
})();

// ── PARTÍCULAS HOVER LOGO ───────────────────────────────────────────────
const pc   = document.getElementById('particle-canvas');
const pctx = pc.getContext('2d');
let particles = [];

function resizePC() {
  pc.width  = window.innerWidth;
  pc.height = window.innerHeight;
}

document.getElementById('logo-wrap').addEventListener('mousemove', e => {
  for (let i = 0; i < 5; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd   = Math.random() * 2 + 0.5;
    particles.push({
      x: e.clientX, y: e.clientY,
      vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
      life: 1, r: Math.random() * 2 + 1
    });
  }
});

(function drawParts() {
  pctx.clearRect(0, 0, pc.width, pc.height);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.025;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pctx.fillStyle = `rgba(0,200,255,${p.life * 0.8})`;
    pctx.shadowBlur = 6;
    pctx.shadowColor = 'rgba(0,200,255,0.5)';
    pctx.fill();
    pctx.shadowBlur = 0;
  });
  requestAnimationFrame(drawParts);
})();

// ── TYPEWRITER BADGE ────────────────────────────────────────────────────
const BADGE_TEXT = '// INICIALIZANDO ZTNETWORK.CL //';
const badgeEl   = document.getElementById('badge-text');
let   bi = 0;
setTimeout(function type() {
  badgeEl.textContent = BADGE_TEXT.slice(0, bi++);
  if (bi <= BADGE_TEXT.length) setTimeout(type, 55);
}, 600);

// ── PROGRESO ────────────────────────────────────────────────────────────
let pct = 0;
const fillEl = document.getElementById('progress-fill');
const pctEl  = document.getElementById('pct');

setTimeout(() => {
  const iv = setInterval(() => {
    pct = Math.min(pct + 1, 72);
    pctEl.textContent  = pct + '%';
    fillEl.style.width = pct + '%';
    if (pct >= 72) clearInterval(iv);
  }, 35);
}, 2200);

// ── INIT ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { resize(); initNodes(); resizePC(); });
resize(); initNodes(); resizePC();
</script>
</body>
</html>
